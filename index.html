<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REALS'M V6 Dashboard</title><style>body{margin:0;background:#0f0f19;color:#fff;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#191928;border:1px solid #2b2b42;border-radius:12px;padding:18px}.num{font-size:28px;color:#64a0ff;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><h1>REALS'M HUB V6</h1><p>License / Trial Dashboard</p><div class="grid"><div class="card">TOTAL<div class="num" id="total">-</div></div><div class="card">ACTIVE<div class="num" id="active">-</div></div><div class="card">FREE<div class="num" id="free">-</div></div><div class="card">PREMIUM<div class="num" id="premium">-</div></div></div></div><script>async function r(){let x=await(await fetch('/api/admin/stats')).json();total.textContent=x.totalLicenses;active.textContent=x.active;free.textContent=x.free;premium.textContent=x.premium}r()</script></body></html>
